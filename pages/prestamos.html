<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscuelaTEC - Gestión de Préstamos</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hojas de Estilo Modulares -->
    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <strong>EscuelaTEC</strong>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#" class="active">Préstamos</a>
            <a href="herramientas.html">herramientas</a>
            <a href="insumos.html">insumos</a>
            <a href="#">Admin</a>
        </nav>
    </header>


    <main>

        <h2>Gestión de Préstamos</h2>


        <!-- ========================= -->
        <!-- FORMULARIO DE PRÉSTAMO    -->
        <!-- ========================= -->

        <section class="card">

            <h3>Nuevo Préstamo</h3>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="Solicitante">Solicitante (Nombre/Legajo):</label>
                <input type="text" id="Solicitante" placeholder="Solicitante (Nombre / Legajo)" required>
                </div>
                <div class="form-group">
                    <label for="item">Item a prestar:</label>
                <select id="item" required>
                    <option value="">Seleccionar Ítem...</option>
                    <option value="1">Tester Digital Fluke</option>
                    <option value="2">Amoladora Angular Bosch</option>
                </select>
                </div>

                <!-- CANTIDAD -->
                 <div class="form-group">
                    <label for="cantidad">Cantidad:</label>
                <input
                    type="number"
                    id="cantidad"
                    placeholder="Cantidad"
                    min="1"
                    value="1"
                    required
                >
                </div>

                <!-- BOTÓN REGISTRAR -->
                <button
                    type="submit"
                    id="btn-registrar"
                >
                    Registrar Préstamo
                </button>

            </form>

        </section>



        <!-- ========================= -->
        <!-- TABLA DE PRÉSTAMOS        -->
        <!-- ========================= -->

        <section class="card">

            <h3>Préstamos Activos</h3>

            <div style="overflow-x: auto;">

                <table id="tabla-historial">

                    <!-- ENCABEZADOS -->
                    <thead>

                        <tr>
                            <th>Solicitante</th>
                            <th>Ítem</th>
                            <th>Cant.</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>

                    </thead>
                    <tbody>
                        <tr>
                            <td>Carlos Gómez</td>
                            <td>Amoladora Angular Bosch</td>
                            <td>1 u.</td>
                            <td><span class="badge">Activo</span></td>
                            <td><button type="button" class="btn-sm">Devolver</button></td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>
<script src="../js/prestamos.js"></script>

</body>

</html>
