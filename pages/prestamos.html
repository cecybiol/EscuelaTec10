<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscuelaTEC - Gestión de Préstamos</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hojas de Estilo Modulares -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <!-- Scripts: orden requerido por app.js (storage -> app -> lógica de la página) -->
    <!-- defer permite ubicarlos en el head sin bloquear el render ni romper el orden -->
    <script src="../js/storage.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/prestamos.js" defer></script>
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <strong>EscuelaTEC</strong>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#" class="active">Préstamos</a>
            <a href="#">Admin</a>
        </nav>
    </header>


    <main>

        <h2>Gestión de Préstamos</h2>


        <!-- ========================= -->
        <!-- FORMULARIO DE PRÉSTAMO    -->
        <!-- ========================= -->

        <section class="card">

            <h3>Nuevo Préstamo</h3>
            <form action="#" method="POST" id="formulario">
                <input type="text" id="solicitante" placeholder="Solicitante (Nombre / Legajo)" required>
                
                <select id="item" required>
                    <option value="">Seleccionar Ítem...</option>
                    <option value="1">Tester Digital Fluke</option>
                    <option value="2">Amoladora Angular Bosch</option>
                </select>


                <!-- CANTIDAD -->
                <input
                    type="number"
                    id="cantidad"
                    placeholder="Cantidad"
                    min="1"
                    value="1"
                    required
                >


                <!-- BOTÓN REGISTRAR -->
                <button
                    type="submit"
                    id="btn-registrar"
                >
                    Registrar Préstamo
                </button>

            </form>

        </section>



        <!-- ========================= -->
        <!-- TABLA DE PRÉSTAMOS        -->
        <!-- ========================= -->

        <section class="card">

            <h3>Préstamos Activos</h3>

            <div style="overflow-x: auto;">

                <table id="tabla-historial">

                    <!-- ENCABEZADOS -->
                    <thead>

                        <tr>
                            <th>Solicitante</th>
                            <th>Ítem</th>
                            <th>Cant.</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>

                    </thead>
                    <tbody id="historial">
                        <tr>
                            <td>Carlos Gómez</td>
                            <td>Amoladora Angular Bosch</td>
                            <td>1 u.</td>
                            <td><span class="badge">Activo</span></td>
                            <td><button type="button" class="btn-sm">Devolver</button></td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</body>

</html>
