<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscuelaTEC - Gestión de Préstamos</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hojas de Estilo Modulares -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <!-- Cabecera Institucional -->
    <header class="site-header">
        <strong>EscuelaTEC</strong>
        <nav class="main-nav">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="prestamos.html" class="active">Préstamos</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor Principal -->
    <main class="main-container">
        
        <!-- Título y Botón QR -->
        <div class="page-header">
            <h2>Gestión de Préstamos</h2>
            <button type="button" class="btn btn-qr">📷 Escanear QR</button>
        </div>

        <!-- Sección: Formulario -->
        <section class="card">
            <h3>Nuevo Préstamo</h3>
            <!-- La clase prestamo-form activará la grilla de 2 columnas en PC -->
            <form action="#" method="POST" class="prestamo-form">
                
                <div class="form-group">
                    <label for="solicitante">Solicitante (Nombre o Legajo)</label>
                    <input type="text" id="solicitante" class="input" placeholder="Ej: Carlos Gómez" required>
                </div>
                
                <div class="form-group">
                    <label for="item">Ítem a prestar</label>
                    <select id="item" class="select" required>
                        <option value="">Seleccionar Ítem...</option>
                        <option value="1">Tester Digital Fluke</option>
                        <option value="2">Amoladora Angular Bosch</option>
                        <option value="3">Proyector Epson</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" class="input" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones (Opcional)</label>
                    <textarea id="observaciones" class="textarea" placeholder="Estado del ítem al entregarlo..."></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Registrar Préstamo</button>
                </div>
            </form>
        </section>

        <!-- Sección: Tablas -->
        <section class="card">
            <h3>Préstamos Activos</h3>
            <div style="overflow-x: auto;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Solicitante</th>
                            <th>Ítem</th>
                            <th>Cant.</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Carlos Gómez</td>
                            <td>Amoladora Angular Bosch</td>
                            <td>1 u.</td>
                            <td><span class="badge badge-warning">Activo</span></td>
                            <td><button type="button" class="btn btn-secondary">Devolver</button></td>
                        </tr>
                        <tr>
                            <td>Ana Martínez</td>
                            <td>Tester Digital Fluke</td>
                            <td>2 u.</td>
                            <td><span class="badge badge-success">Devuelto</span></td>
                            <td>-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer class="site-footer">
        <p>&copy; 2026 EscuelaTEC - Módulo de Préstamos (Equipo 4)</p>
    </footer>

</body>
</html>
