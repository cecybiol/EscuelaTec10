<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscuelaTEC - Préstamos (Beta Minimal)</title>
<link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
</head>
<body>
    <header>
        <strong>EscuelaTEC</strong>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#" class="active">Préstamos</a>
            <a href="#">Admin</a>
        </nav>
    </header>

    <main>
        <h2>Gestión de Préstamos</h2>

        <!-- FORMULARIO BETA -->
        <section class="card">
            <h3>Nuevo Préstamo</h3>
            <form action="#" method="POST">
                <input type="text" placeholder="Solicitante (Nombre / Legajo)" required>
                
                <select required>
                    <option value="">Seleccionar Ítem...</option>
                    <option value="1">Tester Digital Fluke</option>
                    <option value="2">Amoladora Angular Bosch</option>
                </select>

                <input type="number" placeholder="Cantidad" min="1" value="1" required>

                <button type="submit">Registrar Préstamo</button>
            </form>
        </section>

        <!-- TABLA PRINCIPAL -->
        <section class="card">
            <h3>Préstamos Activos</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Solicitante</th>
                            <th>Ítem</th>
                            <th>Cant.</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Carlos Gómez</td>
                            <td>Amoladora Angular Bosch</td>
                            <td>1 u.</td>
                            <td><span class="badge">Activo</span></td>
                            <td><button type="button" class="btn-sm">Devolver</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

</body>
</html>
